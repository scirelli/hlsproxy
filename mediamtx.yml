# MediaMTX Configuration
# Documentation: https://github.com/bluenviron/mediamtx

###############################################
# General settings

logLevel: info
logDestinations: [stdout]

###############################################
# RTSP server (for proxying from cameras)

rtsp: yes
rtspAddress: :8554
protocols: [tcp]

###############################################
# WebRTC server

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8890
webrtcICEServers2: []

###############################################
# HLS server (disabled - using WebRTC only)

hls: no

###############################################
# API (for health checks and monitoring)

api: yes
apiAddress: :9997

###############################################
# Path defaults

pathDefaults:
  # Only connect to camera when someone is viewing
  sourceOnDemand: yes
  # Disconnect from camera after 10s of no viewers
  sourceOnDemandCloseAfter: 10s

###############################################
# Paths - dynamically generated by entrypoint.sh
# Template:
#   cam1:
#     source: rtsp://user:pass@192.168.1.100:554/cam/realmonitor?channel=1&subtype=1
#   cam2:
#     source: rtsp://...

paths:
