server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /var/www/html;
    index index.html;

    server_name _;

    # Serve static files
    location / {
        try_files $uri $uri/ =404;
    }

    # Serve API endpoints
    location /api/ {
        alias /var/www/html/api/;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Serve HLS streams
    location /streams/ {
        alias /var/www/html/streams/;

        # CORS headers for HLS.js
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        # Handle OPTIONS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }

        # HLS playlist files - no caching
        location ~* \.m3u8$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin "*" always;
            types {
                application/vnd.apple.mpegurl m3u8;
            }
        }

        # HLS segment files - short cache
        location ~* \.ts$ {
            add_header Cache-Control "public, max-age=10";
            add_header Access-Control-Allow-Origin "*" always;
            types {
                video/mp2t ts;
            }
        }
    }

    # Disable access logging for health checks
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/vnd.apple.mpegurl;
    gzip_min_length 1000;
}
