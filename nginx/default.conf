server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;

    server_name _;

    # Serve static files
    location / {
        try_files $uri $uri/ =404;
    }

    # Serve API endpoints
    location /api/ {
        alias /var/www/html/api/;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Proxy WebRTC/WHEP requests to MediaMTX
    # MediaMTX serves WHEP at /{stream}/whep
    location ~ ^/(cam[0-9]+)/whep$ {
        proxy_pass http://127.0.0.1:8889/$1/whep;
        proxy_http_version 1.1;

        # Required for WebRTC signaling
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;

        # Don't buffer - important for streaming
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
